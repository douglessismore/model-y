<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, ReferenceLine } = Recharts;

// ─── Constants from the actual Tesla quote ───────────────────────────────────
const CASH_PRICE = 54960;     // all-in (5-seat config), matches Tesla's finance calculator
const MIN_DOWN = 3332;        // minimum due at delivery (covers taxes & fees)
const APR = 0.99;
const TERM = 72;

// Exact monthly figures straight from Tesla's own calculator (down payment -> monthly),
// 0.99% APR / 72-month term. These are verified values, not formula estimates.
const TESLA_QUOTES = [
  [3332,739],[5000,715],[6000,701],[7000,687],[8000,672],[9000,658],[10000,644],
  [11000,629],[12000,615],[13000,601],[14000,586],[15000,572],[16000,558],[17000,543],
  [18000,529],[19000,515],[20000,501],[21000,486],[22000,472],[23000,458],[24000,443],
  [25000,429],[26000,415],[27000,400],[28000,386],[29000,372],[30000,357],[31000,343],
  [32000,329],[33000,314],[34000,300],[35000,286],[36000,271],[37000,257],[38000,243],
  [39000,228],[40000,214],[41000,200],[42000,186],[43000,171],[44000,157],
];

// Reference rows for the scenarios table
const TABLE_ROWS = [
  { down: 3332,  note: 'Minimum — taxes & fees only, ~$0 toward the car' },
  { down: 5000,  note: '' },
  { down: 10000, note: '' },
  { down: 15000, note: '' },
  { down: 20000, note: '' },
  { down: 25000, note: '' },
  { down: 30000, note: '' },
  { down: 35000, note: '' },
  { down: 40000, note: '' },
];

// ─── Math ────────────────────────────────────────────────────────────────────
// Looks up Tesla's exact monthly for a down payment; interpolates between verified
// points and extends past the last point along the same slope (toward $0 at payoff).
function monthlyForDown(down) {
  const pts = TESLA_QUOTES;
  if (down <= pts[0][0]) return pts[0][1];
  const last = pts[pts.length - 1];
  if (down >= last[0]) {
    const prev = pts[pts.length - 2];
    const slope = (last[1] - prev[1]) / (last[0] - prev[0]);
    return Math.max(0, last[1] + slope * (down - last[0]));
  }
  for (let i = 0; i < pts.length - 1; i++) {
    if (down >= pts[i][0] && down <= pts[i + 1][0]) {
      const t = (down - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
      return pts[i][1] + t * (pts[i + 1][1] - pts[i][1]);
    }
  }
  return last[1];
}
function scenario(down) {
  const monthly = Math.round(monthlyForDown(down));
  const totalPayments = monthly * TERM;
  const loan = Math.max(0, CASH_PRICE - down);
  const totalCar = down + totalPayments;
  const totalInterest = Math.max(0, totalCar - CASH_PRICE);
  return { down, loan, monthly, totalPayments, totalInterest, totalCar };
}

const fmt = (n, d = 0) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
const fmtK = (n) => Math.abs(n) >= 1000 ? '$' + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : fmt(n);

// ─── Primitives ──────────────────────────────────────────────────────────────
function Section({ children, className = '' }) {
  return <section className={`max-w-5xl mx-auto px-5 sm:px-10 ${className}`}>{children}</section>;
}

// ─── Header ──────────────────────────────────────────────────────────────────
function Header() {
  return (
    <header className="border-b border-stone-200/70">
      <div className="max-w-5xl mx-auto px-5 sm:px-10 py-4 flex items-center justify-between">
        <div className="text-sm text-stone-600">Tesla Model Y Premium · financing</div>
        <div className="hidden sm:block text-xs text-stone-400">0.99% APR · 72 months</div>
      </div>
    </header>
  );
}

// ─── Hero ────────────────────────────────────────────────────────────────────
function Hero() {
  return (
    <Section className="pt-10 sm:pt-14 pb-8">
      <div className="mono text-xs tracking-[0.2em] uppercase text-stone-500 mb-3">
        Tesla Model Y Premium AWD · Quicksilver · white interior · 5-seat
      </div>
      <h1 className="display text-3xl sm:text-5xl font-medium text-ink leading-[1.05] max-w-3xl">
        The financing picture, one screen.
      </h1>
      <p className="mt-4 text-base sm:text-lg text-stone-600 max-w-2xl leading-relaxed">
        All-in price is <span className="text-ink font-medium">{fmt(CASH_PRICE)}</span> including
        Texas taxes and fees. Financed at <span className="text-ink font-medium">0.99% APR over 72 months</span>.
        Everything below shows how the down payment changes the monthly — and why it barely
        changes the total.
      </p>
    </Section>
  );
}

// ─── Key insight ─────────────────────────────────────────────────────────────
function KeyInsight() {
  const maxInterest = scenario(MIN_DOWN).totalInterest;
  return (
    <Section className="pb-8 sm:pb-10">
      <div className="rounded-2xl bg-emerald-50/70 ring-1 ring-emerald-200 p-6 sm:p-8">
        <div className="mono text-[10px] tracking-[0.18em] uppercase text-emerald-700 mb-3">The one thing to understand</div>
        <p className="display text-xl sm:text-2xl text-ink leading-snug max-w-3xl">
          Because the rate is only 0.99%, the total cost is almost the same no matter what's put down.
        </p>
        <p className="mt-4 text-stone-700 leading-relaxed max-w-2xl">
          Financing the entire amount costs about <span className="text-ink font-medium">{fmt(maxInterest)}</span> in
          interest across all six years — roughly {fmt(maxInterest / 72)}/month. That's the whole price
          of borrowing the money instead of paying cash. It's low enough that the down payment is
          really a <span className="text-ink font-medium">cash-flow decision</span> (what monthly is
          comfortable) rather than a way to save money.
        </p>
      </div>
    </Section>
  );
}

// ─── Interactive explorer ────────────────────────────────────────────────────
function Explorer() {
  const [down, setDown] = useState(20000);
  const s = scenario(down);
  return (
    <Section className="pb-8 sm:pb-10">
      <div className="rounded-2xl bg-white ring-soft p-6 sm:p-9">
        <h2 className="display text-2xl sm:text-3xl font-medium text-ink mb-1">Try any down payment</h2>
        <p className="text-sm text-stone-500 mb-7">Drag to see the monthly payment and totals update.</p>

        <div className="grid sm:grid-cols-[1fr,auto] gap-8 sm:gap-12 items-end">
          <div>
            <div className="flex items-baseline justify-between mb-3">
              <span className="text-sm text-stone-700">Down payment (cash up front)</span>
              <span className="mono text-lg text-ink number-tabular">{fmt(down)}</span>
            </div>
            <input type="range" min={MIN_DOWN} max={CASH_PRICE} step={250} value={down}
                   onChange={(e) => setDown(parseFloat(e.target.value))} className="w-full" />
            <div className="flex justify-between mt-2 text-xs text-stone-400">
              <span>{fmt(MIN_DOWN)} min</span>
              <span>{fmt(CASH_PRICE)} (paid in full)</span>
            </div>
          </div>
          <div className="text-right sm:border-l sm:border-stone-200 sm:pl-12">
            <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-1">Monthly payment</div>
            <div className="display text-5xl sm:text-6xl font-medium text-ink number-tabular leading-none">
              {fmt(s.monthly)}
            </div>
            <div className="text-sm text-stone-500 mt-2">for 72 months</div>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-5 sm:gap-8 mt-9 pt-7 border-t border-stone-100">
          <div>
            <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-1.5">Amount financed</div>
            <div className="display text-xl sm:text-2xl font-medium number-tabular">{fmt(s.loan)}</div>
          </div>
          <div>
            <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-1.5">Total of 72 payments</div>
            <div className="display text-xl sm:text-2xl font-medium number-tabular">{fmt(s.totalPayments)}</div>
          </div>
          <div>
            <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-1.5">Interest paid</div>
            <div className="display text-xl sm:text-2xl font-medium number-tabular text-amber-700">{fmt(s.totalInterest)}</div>
          </div>
          <div>
            <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-1.5">Total cost of car</div>
            <div className="display text-xl sm:text-2xl font-medium number-tabular">{fmt(s.totalCar)}</div>
          </div>
        </div>
        <p className="text-xs text-stone-400 mt-6">
          Total cost of car = down payment + all 72 payments. It ranges only from {fmt(CASH_PRICE)} (paid in full)
          to {fmt(scenario(MIN_DOWN).totalCar)} (minimum down) — a spread of just {fmt(scenario(MIN_DOWN).totalInterest)}.
        </p>
      </div>
    </Section>
  );
}

// ─── Scenarios table ─────────────────────────────────────────────────────────
function ScenariosTable() {
  return (
    <Section className="pb-8 sm:pb-10">
      <div className="rounded-2xl bg-white ring-soft overflow-hidden">
        <div className="px-5 sm:px-8 pt-6 pb-2">
          <h2 className="display text-2xl sm:text-3xl font-medium text-ink">The exact Tesla quotes</h2>
          <p className="text-sm text-stone-500 mt-1">Monthly figures verified directly against Tesla's calculator — not estimates.</p>
        </div>
        <div className="sm:hidden px-5 pt-2 pb-1 flex items-center gap-2 text-xs text-stone-500 bg-stone-50/40 border-t border-stone-100">
          <span aria-hidden>←</span><span>Swipe to see all columns</span><span aria-hidden>→</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead>
              <tr className="text-left text-stone-500">
                <th className="px-4 sm:px-8 py-3 mono text-[10px] tracking-[0.15em] uppercase font-medium">Down payment</th>
                <th className="px-3 py-3 mono text-[10px] tracking-[0.15em] uppercase font-medium text-right">Monthly</th>
                <th className="px-3 py-3 mono text-[10px] tracking-[0.15em] uppercase font-medium text-right">72 payments</th>
                <th className="px-3 py-3 mono text-[10px] tracking-[0.15em] uppercase font-medium text-right">Interest</th>
                <th className="px-4 sm:px-8 py-3 mono text-[10px] tracking-[0.15em] uppercase font-medium text-right">Total cost</th>
              </tr>
            </thead>
            <tbody>
              {TABLE_ROWS.map((row) => {
                const monthly = Math.round(monthlyForDown(row.down));
                const totalPayments = monthly * TERM;
                const totalCar = row.down + totalPayments;
                const interest = Math.max(0, totalCar - CASH_PRICE);
                return (
                  <tr key={row.down} className="border-t border-stone-100">
                    <td className="px-4 sm:px-8 py-4">
                      <div className="font-medium text-ink number-tabular">{fmt(row.down)}</div>
                      {row.note && <div className="text-xs text-stone-500 mt-0.5">{row.note}</div>}
                    </td>
                    <td className="px-3 py-4 text-right">
                      <span className="display text-lg sm:text-xl font-medium number-tabular text-ink">{fmt(monthly)}</span>
                    </td>
                    <td className="px-3 py-4 mono text-sm number-tabular text-stone-700 text-right">{fmt(totalPayments)}</td>
                    <td className="px-3 py-4 mono text-sm number-tabular text-amber-700 text-right">{fmt(interest)}</td>
                    <td className="px-4 sm:px-8 py-4 mono text-sm number-tabular text-ink text-right">{fmt(totalCar)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </Section>
  );
}

// ─── Monthly chart ───────────────────────────────────────────────────────────
function MonthlyChart() {
  const data = TABLE_ROWS.map((row) => ({
    label: fmtK(row.down) + ' down',
    monthly: Math.round(monthlyForDown(row.down)),
  }));
  return (
    <Section className="pb-8 sm:pb-10">
      <div className="rounded-2xl bg-white ring-soft p-6 sm:p-8">
        <h2 className="display text-2xl sm:text-3xl font-medium text-ink mb-1">Monthly payment by down payment</h2>
        <p className="text-sm text-stone-500 mb-6">More down means a lower monthly. The total cost stays nearly flat (see table above).</p>
        <div className="h-64 sm:h-72">
          <ResponsiveContainer>
            <BarChart data={data} margin={{ top: 16, right: 8, left: 0, bottom: 0 }}>
              <CartesianGrid stroke="#E7E2D6" strokeDasharray="2 4" vertical={false} />
              <XAxis dataKey="label" tick={{ fill: '#57534e', fontSize: 11 }} tickLine={false} axisLine={{ stroke: '#E7E2D6' }} />
              <YAxis tick={{ fill: '#78716c', fontSize: 11 }} tickLine={false} axisLine={{ stroke: '#E7E2D6' }} tickFormatter={(v) => '$' + v} width={48} />
              <Tooltip contentStyle={{ background: '#FBF8F3', border: '1px solid #E7E2D6', borderRadius: 8, fontSize: 12 }} formatter={(v) => [fmt(v) + '/mo', 'Monthly']} cursor={{ fill: 'rgba(27,26,23,0.04)' }} />
              <Bar dataKey="monthly" radius={[6, 6, 0, 0]} fill="#1B1A17" label={{ position: 'top', fill: '#1B1A17', fontSize: 12, formatter: (v) => '$' + v }} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </Section>
  );
}

// ─── Full cost to own ────────────────────────────────────────────────────────
function FullCost() {
  const [down, setDown] = useState(20000);
  const [annualMiles, setAnnualMiles] = useState(35000);
  const [electricityRate, setElectricityRate] = useState(0.14);
  const [insurance, setInsurance] = useState(210);
  const [maintenance, setMaintenance] = useState(60);
  const milesPerKwh = 3.5;

  const s = scenario(down);
  const electricity = (annualMiles / 12) / milesPerKwh * electricityRate;
  const operating = electricity + insurance + maintenance;
  const allInMonthly = s.monthly + operating;
  const lifetime = s.totalCar + operating * TERM;

  return (
    <Section className="pb-8 sm:pb-10">
      <div className="rounded-2xl bg-white ring-soft p-6 sm:p-9">
        <h2 className="display text-2xl sm:text-3xl font-medium text-ink mb-1">The full monthly + 6-year picture</h2>
        <p className="text-sm text-stone-500 mb-7">
          The loan payment is what's being financed. Running costs (electricity, insurance, maintenance) are
          paid no matter how it's financed. Adjust any number — insurance especially, once the real quote is in.
        </p>

        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <label className="block">
            <div className="flex items-baseline justify-between mb-2">
              <span className="text-sm text-stone-700">Down payment</span>
              <span className="mono text-sm text-ink number-tabular">{fmt(down)}</span>
            </div>
            <input type="range" min={MIN_DOWN} max={CASH_PRICE} step={250} value={down} onChange={(e) => setDown(parseFloat(e.target.value))} className="w-full" />
          </label>
          <label className="block">
            <div className="flex items-baseline justify-between mb-2">
              <span className="text-sm text-stone-700">Annual miles</span>
              <span className="mono text-sm text-ink number-tabular">{annualMiles.toLocaleString()}</span>
            </div>
            <input type="range" min={10000} max={50000} step={1000} value={annualMiles} onChange={(e) => setAnnualMiles(parseFloat(e.target.value))} className="w-full" />
          </label>
          <div>
            <div className="text-sm text-stone-700 mb-1.5">Insurance / mo <span className="text-amber-700 text-xs">· estimate</span></div>
            <div className="flex items-baseline"><span className="text-stone-400 text-sm mr-1">$</span><input type="number" value={insurance} onChange={(e) => setInsurance(parseFloat(e.target.value) || 0)} className="inline-num" /></div>
            <div className="text-xs text-stone-400 mt-1">Update with your real quote</div>
          </div>
          <div>
            <div className="text-sm text-stone-700 mb-1.5">Maintenance / mo</div>
            <div className="flex items-baseline"><span className="text-stone-400 text-sm mr-1">$</span><input type="number" value={maintenance} onChange={(e) => setMaintenance(parseFloat(e.target.value) || 0)} className="inline-num" /></div>
            <div className="text-xs text-stone-400 mt-1">EVs are low — tires, wipers, cabin filter</div>
          </div>
        </div>

        <div className="rounded-xl ring-soft overflow-hidden">
          <table className="w-full text-sm">
            <tbody>
              <tr className="border-b border-stone-100">
                <td className="px-4 sm:px-6 py-3 text-stone-700">Loan payment</td>
                <td className="px-4 sm:px-6 py-3 mono number-tabular text-right text-ink">{fmt(s.monthly)}/mo</td>
              </tr>
              <tr className="border-b border-stone-100">
                <td className="px-4 sm:px-6 py-3 text-stone-600">Electricity <span className="text-xs text-stone-400">· {annualMiles.toLocaleString()} mi/yr @ {milesPerKwh} mi/kWh</span></td>
                <td className="px-4 sm:px-6 py-3 mono number-tabular text-right text-stone-700">{fmt(electricity)}/mo</td>
              </tr>
              <tr className="border-b border-stone-100">
                <td className="px-4 sm:px-6 py-3 text-stone-600">Insurance</td>
                <td className="px-4 sm:px-6 py-3 mono number-tabular text-right text-stone-700">{fmt(insurance)}/mo</td>
              </tr>
              <tr className="border-b border-stone-100">
                <td className="px-4 sm:px-6 py-3 text-stone-600">Maintenance</td>
                <td className="px-4 sm:px-6 py-3 mono number-tabular text-right text-stone-700">{fmt(maintenance)}/mo</td>
              </tr>
              <tr className="bg-stone-50/60 border-b border-stone-100">
                <td className="px-4 sm:px-6 py-4 text-ink font-medium">All-in monthly</td>
                <td className="px-4 sm:px-6 py-4 text-right"><span className="display text-xl sm:text-2xl text-ink number-tabular">{fmt(allInMonthly)}</span><span className="text-sm text-stone-500">/mo</span></td>
              </tr>
              <tr className="bg-stone-50/60">
                <td className="px-4 sm:px-6 py-4 text-ink font-medium">Total cost to own + operate, 6 years</td>
                <td className="px-4 sm:px-6 py-4 text-right"><span className="display text-xl sm:text-2xl text-ink number-tabular">{fmt(lifetime)}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </Section>
  );
}

// ─── Notes ───────────────────────────────────────────────────────────────────
function Notes() {
  return (
    <Section className="pb-20">
      <div className="border-t border-stone-200 pt-8 grid sm:grid-cols-2 gap-6 text-sm text-stone-600 leading-relaxed">
        <div>
          <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-2">The car</div>
          Model Y Premium AWD, 5-seat. Quicksilver paint, Black &amp; White premium interior.
          Warranty: 4 years / 50,000 miles basic; 8 years / 120,000 miles battery &amp; drive unit.
        </div>
        <div>
          <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-2">Price breakdown (5-seat, from receipt)</div>
          Base $34,000 + premium interior $1,000 + Quicksilver $2,000 + Premium AWD $15,990 +
          destination $1,390 + order fee $250 − referral credit $2,500 = <span className="text-ink">$52,130</span> car price.
          Plus Texas registration, plate, inspection, and 6.25% sales tax. The current order still lists
          a $2,500 seven-seat option being removed.
        </div>
        <div>
          <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-2">The financing</div>
          0.99% promotional APR, 72-month term, excellent credit. Monthly figures are exact from
          Tesla's own calculator. No prepayment penalty — paying extra anytime trims the
          (already small) interest further.
        </div>
        <div>
          <div className="mono text-[10px] tracking-[0.18em] uppercase text-stone-500 mb-2">Exact vs estimated · not included</div>
          Down payment, monthly, and interest come straight from Tesla. Electricity, insurance, and
          maintenance are estimates and adjustable above — insurance is the one worth replacing with a
          real quote. FSD ($99/mo) and any home-charger install are not included.
        </div>
      </div>
    </Section>
  );
}

function StatusNote() {
  return (
    <Section className="pb-6">
      <div className="rounded-xl bg-amber-50/70 ring-1 ring-amber-200 p-4 sm:p-5 text-sm text-stone-700 leading-relaxed">
        <span className="text-ink font-medium">Note on the current order:</span> it accidentally
        includes a $2,500 seven-seat option that's being removed. Because a $2,500 referral credit is
        also on the order, removing the seven-seat turns that credit into a real ~$2,500 reduction —
        so the corrected five-seat order is about $2,500 cheaper than the receipt currently shows. The
        finance numbers below are exact from Tesla's calculator; the final all-in total will be

      </div>
    </Section>
  );
}

  return (
